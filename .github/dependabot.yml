# Dependabot configuration file
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Kept deliberately quiet: every Dependabot PR (and every rebase of one) runs CI,
# so updates are batched into as few PRs as possible.
#   - npm version updates: one PR a month with every minor/patch update.
#   - npm security updates: one PR for all open advisories, instead of one per package.
#   - Major versions are not proposed; upgrade those by hand.
#   - GitHub Actions: one PR a month.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
