name: Check migrations for permissive RLS policies

on:
  pull_request:
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  check-permissive-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan new/changed migrations for USING (true) policies
        run: |
          set -euo pipefail

          base_ref="${{ github.event.pull_request.base.sha }}"
          changed_files=$(git diff --name-only --diff-filter=ACM "$base_ref" -- 'supabase/migrations/*.sql')

          if [ -z "$changed_files" ]; then
            echo "No migration files changed."
            exit 0
          fi

          echo "Checking changed migrations:"
          echo "$changed_files"

          # Matches USING (true) / USING(true) / using ( true ) etc, case-insensitive.
          # This pattern has repeatedly been shipped and later had to be walked back
          # — a table with USING (true) on
          # an authenticated/anon-facing policy is effectively public.
          pattern='using[[:space:]]*\([[:space:]]*true[[:space:]]*\)'

          violations=""
          for f in $changed_files; do
            if [ -f "$f" ] && grep -Eiq "$pattern" "$f"; then
              violations="$violations$f"$'\n'
              echo "::error file=$f::Found a permissive 'USING (true)' RLS policy. If this is intentional (e.g. a genuinely public table), add an inline SQL comment explaining why and get explicit review sign-off."
              grep -Ein "$pattern" "$f" | sed 's/^/    /'
            fi
          done

          if [ -n "$violations" ]; then
            echo ""
            echo "Permissive RLS policies found in:"
            echo "$violations"
            exit 1
          fi

          echo "No permissive RLS policies found."
